buckets:
  # 8: title vue/go alone (+6) + weak text no longer clears TOP without real extras
  top: 8

facts:
  # EUROPE only: US-only / US+CA hiring_scope is a hard cut; worldwide still ok.
  # residence_countries + hiring_scope.narrow_penalty: soft hit when restricted
  # to 1–2 countries that omit RO (EUROPE/EMEA/WORLDWIDE regions skip this).
  residence_regions: [EUROPE]
  residence_countries: [RO]
  office:
    scored: true
    allow_countries:
      - "AT"
      - "BE"
      - "CY"
      - "CZ"
      - "DE"
      - "DK"
      - "EE"
      - "ES"
      - "FI"
      - "FR"
      - "GR"
      - "HR"
      - "HU"
      - "IE"
      - "IT"
      - "LT"
      - "LU"
      - "LV"
      - "MT"
      - "NL"
      - "PL"
      - "PT"
      - "RO"
      - "SE"
      - "SI"
      - "SK"
      - "IS"
      - "LI"
      - "NO"
      - "CH"
      - "GB"
    allow_regions: [EUROPE, EMEA, WORLDWIDE]
  hiring_scope:
    scored: true
    # +5 once for worldwide / EUROPE / EMEA (keeps Hostaway-class at buckets.top: 8)
    delta: 5
    narrow_penalty: -4
  work_authorization:
    scored: true
    gates: [required]
  timezone:
    scored: true
    allow: [CET, GMT, EET]
  compensation:
    scored: false
    allow_currencies: [EUR, USD, GBP]
  work_mode:
    scored: true
    # hybrid / office → REVIEW (not REJECTED); remote stays unscored cut
    gates: [hybrid, office]
  employment_load:
    scored: false
  engagement:
    scored: false
